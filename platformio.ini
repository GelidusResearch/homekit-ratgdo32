; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
upload_speed = 921600
monitor_speed = 115200 ; must remain at 115200 for improv
upload_port = COM13
; Following embedded files required if we build our own ESPIDF (see framework below)
;board_build.embed_txtfiles =
;    managed_components/espressif__esp_insights/server_certs/https_server.crt

[env:ratgdo_esp32dev]
platform = espressif32
board = grgdo1_esp32S
board_build.partitions = partitions.csv
framework = arduino
build_flags =
    ${env.build_flags}
    -Wall
    -Wno-format
    -Wl,--wrap=esp_panic_handler
    -Os
    ;-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
    -D USE_ESP_IDF_LOG
    -D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
    -D SOC_WIFI_SUPPORTED=1
    -D CONFIG_ETH_ENABLED=1
    -D USE_GDOLIB
    -D RATGDO32_DISCO
    ;-D USE_NTP_TIMESTAMP
    ;-D CRASH_DEBUG
    -D GRGDO1_V2
    -D USE_DHT22
    -D USE_AHT20
    ; GRGDO1 Hardware-specific GPIO pin definitions
    -D UART_TX_GPIO=GPIO_NUM_22
    -D UART_RX_GPIO=GPIO_NUM_21
    -D LED_BUILTIN_GPIO=GPIO_NUM_4
    -D LED_BUILTIN_ON_STATE=HIGH
    -D INPUT_OBST_GPIO=GPIO_NUM_23
    ; GRGDO1 v2 I2C pins for VL53L1X distance sensor (AUX1 connector)
    -D SENSOR_SDA_GPIO=GPIO_NUM_26
    -D SENSOR_SCL_GPIO=GPIO_NUM_25
    ; AHT20 (confirmed via hardware testing to need the opposite SDA/SCL
    ; assignment from the VL53L1X above, despite sharing the AUX1 connector,
    ; which is the only I2C-capable port on the V2 board)
    -D AHT20_SDA_GPIO=GPIO_NUM_25
    -D AHT20_SCL_GPIO=GPIO_NUM_26
    -D DRY_CONTACT_OPEN_GPIO=GPIO_NUM_18
    -D DRY_CONTACT_CLOSE_GPIO=GPIO_NUM_19
    -D DRY_CONTACT_LIGHT_GPIO=GPIO_NUM_17
    ; GRGDO1 Git repository information
    -D GITUSER=gelidusresearch
    -D GITREPO=homekit-ratgdo32
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/GelidusResearch/gdolib#v1.2.11
    https://github.com/HomeSpan/HomeSpan.git#2.1.8
    https://github.com/stm32duino/VL53L1X#2.0.1
    https://github.com/improv-wifi/sdk-cpp.git#v1.2.5
    https://github.com/mathertel/OneButton#2.6.1
    https://github.com/shah253kt/magic_enum
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit AHTX0@^2.0.5
lib_ldf_mode = deep+
lib_compat_mode = off
extra_scripts =
   build_flags.py
   pre:build_web_content.py
   pre:auto_firmware_version.py
   pre:patch_files.py
   post:upload_fw.py


;-------------------------------------------------------------------------
; GRGDO1 Rev1 Board - Different I2C pins for VL53L1X sensor
;-------------------------------------------------------------------------
[env:ratgdo_esp32dev_rev1]
extends = env:ratgdo_esp32dev
build_unflags =
    -D SENSOR_SDA_GPIO=GPIO_NUM_26
    -D SENSOR_SCL_GPIO=GPIO_NUM_25
    -D AHT20_SDA_GPIO=GPIO_NUM_25
    -D AHT20_SCL_GPIO=GPIO_NUM_26
    -D GRGDO1_V2
build_flags =
    ${env:ratgdo_esp32dev.build_flags}
    ; GRGDO1 v1 I2C pins for VL53L1X distance sensor
    -D SENSOR_SDA_GPIO=GPIO_NUM_3
    -D SENSOR_SCL_GPIO=GPIO_NUM_1
    -D AHT20_SDA_GPIO=GPIO_NUM_3
    -D AHT20_SCL_GPIO=GPIO_NUM_1
    ; Enable GRGDO1 v1 specific code (Serial port redirects)
    -D GRGDO1_V1
    -D USE_GDOLIB
    -D USE_DHT22
    -D USE_AHT20
    -D RATGDO32_DISCO

;-------------------------------------------------------------------------
; GRGDO1 Rev3 Board - ESP32C6
;-------------------------------------------------------------------------
[env:ratgdo_esp32dev_rev3]
platform = espressif32
board = grgdo1_esp32C6
board_build.mcu = esp32c6
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
framework = arduino
upload_port = COM109
build_flags =
	;-D ARDUINO_USB_MODE=1
	;-D ARDUINO_USB_CDC_ON_BOOT=1
    ${env.build_flags}
    -Wall
    -Wno-format
    -Os
    ;-Wl,--wrap=esp_panic_handler
    ; --wrap=esp_panic_handler is Xtensa-specific and causes issues on RISC-V
    ;-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
    -D USE_ESP_IDF_LOG
    -D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
    -D SOC_WIFI_SUPPORTED=1
    -D CONFIG_ETH_ENABLED=1
    -D USE_GDOLIB
    ;-D USE_NTP_TIMESTAMP
    ;-D CRASH_DEBUG
    -D GRGDO1_V3
    -D RATGDO32_DISCO
    -D USE_DHT22
    -D USE_AHT20
    ; GRGDO1 v3 Hardware-specific GPIO pin definitions
    -D UART_TX_GPIO=GPIO_NUM_5
    -D UART_RX_GPIO=GPIO_NUM_4
    -D LED_BUILTIN_GPIO=GPIO_NUM_6
    -D LED_BUILTIN_ON_STATE=HIGH
    -D INPUT_OBST_GPIO=GPIO_NUM_20
    ; GRGDO1 v3 I2C pins for VL53L1X distance sensor (AUX2)
    -D SENSOR_SDA_GPIO=GPIO_NUM_11
    -D SENSOR_SCL_GPIO=GPIO_NUM_10
    -D SENSOR_SHUTDOWN_GPIO=GPIO_NUM_3
    ; GRGDO1 v3 I2C pins for AHT20 temperature/humidity sensor (AUX1)
    -D AHT20_SDA_GPIO=GPIO_NUM_7
    -D AHT20_SCL_GPIO=GPIO_NUM_19
    -D DRY_CONTACT_OPEN_GPIO=GPIO_NUM_21
    -D DRY_CONTACT_CLOSE_GPIO=GPIO_NUM_22
    -D DRY_CONTACT_LIGHT_GPIO=GPIO_NUM_23
    ; GRGDO1 Git repository information
    -D GITUSER=gelidusresearch
    -D GITREPO=homekit-ratgdo32
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/GelidusResearch/gdolib#v1.2.11
    https://github.com/HomeSpan/HomeSpan.git#2.1.8
    https://github.com/stm32duino/VL53L1X#2.0.1
    https://github.com/improv-wifi/sdk-cpp.git#v1.2.5
    https://github.com/mathertel/OneButton#2.6.1
    https://github.com/shah253kt/magic_enum
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit AHTX0@^2.0.5
lib_ldf_mode = deep+
lib_compat_mode = off
extra_scripts =
   build_flags.py
   pre:build_web_content.py
   pre:auto_firmware_version.py
   pre:patch_files.py
   post:upload_fw.py
